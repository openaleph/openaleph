ScopedTokenCreate:
  type: object
  additionalProperties: false
  required: ["label", "read", "expires_in"]
  properties:
    label:
      type: string
      minLength: 1
      maxLength: 100
      example: Nightly import job
      description: What the token is for. Shown when listing tokens.
    read:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      description: IDs of the collections the token may read.
      items:
        type: integer
        minimum: 1
    write:
      type: array
      maxItems: 100
      uniqueItems: true
      description: >-
        IDs of the collections the token may write to. Each must also be
        listed in `read`.
      items:
        type: integer
        minimum: 1
    expires_in:
      type: integer
      minimum: 60
      example: 86400
      description: >-
        Lifetime in seconds. Must not exceed the maximum announced as
        `auth.scoped_tokens_max_expire` in the metadata.

ScopedToken:
  type: object
  properties:
    id:
      type: string
      readOnly: true
      description: Public identifier of the token, used to revoke it.
    label:
      type: string
    read:
      type: array
      items:
        type: integer
    write:
      type: array
      items:
        type: integer
    created_at:
      type: string
      format: date-time
      readOnly: true
    expires_at:
      type: string
      format: date-time
      readOnly: true
    token:
      type: string
      readOnly: true
      description: >-
        The credential itself. Only present in the response that creates
        the token; it cannot be retrieved later.
